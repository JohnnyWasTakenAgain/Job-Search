<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10121a; --bg-alt: #171a24; --card: #1b1f2c; --card-hover: #212536;
    --border: #2a2f42; --text: #eeeae0; --text-dim: #9498ab; --text-faint: #5e6478;
    --amber: #e8a33d; --amber-dim: rgba(232,163,61,0.14);
    --teal: #4fb8a3; --teal-dim: rgba(79,184,163,0.14);
    --red: #d16b6b; --red-dim: rgba(209,107,107,0.14);
    --violet: #8b8fd6; --violet-dim: rgba(139,143,214,0.14);
    --date-green: #5fbf87; --date-green-dim: rgba(95,191,135,0.14);
    --date-yellow: #e0c341; --date-yellow-dim: rgba(224,195,65,0.14);
    --date-blue: #5b93d1; --date-blue-dim: rgba(91,147,209,0.14);
    --display: 'Space Grotesk', sans-serif; --body: 'Inter', sans-serif; --mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(16,18,26,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:18px 24px 14px;}
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .radar-dot{width:12px;height:12px;border-radius:50%;background:var(--amber);animation:ping 2.4s infinite;}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(232,163,61,0.55);}70%{box-shadow:0 0 0 10px rgba(232,163,61,0);}100%{box-shadow:0 0 0 0 rgba(232,163,61,0);}}
  h1{font-family:var(--display);font-size:22px;font-weight:700;margin:0;letter-spacing:-0.02em;}
  .subtitle{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:2px;}
  .stats{display:flex;gap:18px;font-family:var(--mono);font-size:12px;color:var(--text-dim);}
  .stat b{color:var(--text);font-size:15px;display:block;font-family:var(--display);}
  button{font-family:var(--body);cursor:pointer;border:none;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:8px 12px;border-radius:8px;font-size:12px;}
  .btn-ghost:hover{color:var(--text);border-color:#3a3f56;}
  .btn-ghost.on{color:var(--amber);border-color:var(--amber);}
  .search-row{margin-top:14px;}
  .search-input{width:100%;background:var(--bg-alt);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;font-family:var(--body);}
  .search-input:focus{outline:none;border-color:var(--amber);}
  .tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:4px;flex-wrap:wrap;}
  .tab{font-family:var(--mono);font-size:12px;white-space:nowrap;padding:8px 13px;border-radius:20px;background:var(--bg-alt);border:1px solid var(--border);color:var(--text-dim);}
  .tab.active{background:var(--amber-dim);border-color:var(--amber);color:var(--amber);}
  .content{max-width:900px;margin:0 auto;padding:22px 20px 80px;}
  .empty{text-align:center;padding:60px 20px;color:var(--text-faint);font-family:var(--mono);font-size:13px;border:1px dashed var(--border);border-radius:12px;}
  .empty b{display:block;color:var(--text-dim);font-family:var(--display);font-size:16px;margin-bottom:6px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;padding:16px 18px;border-left:3px solid var(--border);}
  .card.fit-3{border-left-color:var(--amber);}
  .card.fit-2{border-left-color:var(--teal);}
  .card.fit-1{border-left-color:var(--text-faint);}
  .card-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .card-title{font-family:var(--display);font-size:16px;font-weight:600;margin:0;}
  .card-company{color:var(--text-dim);font-weight:400;}
  .signal{display:flex;gap:2px;align-items:flex-end;height:11px;}
  .signal i{width:3px;background:var(--text-faint);border-radius:1px;display:block;}
  .signal i:nth-child(1){height:4px;} .signal i:nth-child(2){height:7px;} .signal i:nth-child(3){height:11px;}
  .card.fit-3 .signal i{background:var(--amber);}
  .card.fit-2 .signal i:nth-child(-n+2){background:var(--teal);}
  .card.fit-1 .signal i:nth-child(1){background:var(--text-dim);}
  .verify-star{font-size:11px;line-height:1;cursor:default;font-family:var(--mono);}
  .verify-star.yes{color:var(--amber);}
  .verify-star.no{color:var(--text-faint);opacity:0.6;}
  .meta-line{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:4px;}
  .tag-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
  .tag-chip{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:4px;background:rgba(255,255,255,0.04);color:var(--text-faint);border:1px solid var(--border);}
  .desc{font-size:13px;color:var(--text-dim);margin:10px 0 12px;line-height:1.5;}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .badge{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:5px;text-transform:uppercase;}
  .badge.applied{background:var(--teal-dim);color:var(--teal);}
  .badge.rejected{background:var(--red-dim);color:var(--red);}
  .badge.interview{background:var(--violet-dim);color:var(--violet);}
  .badge.notint{background:rgba(255,255,255,0.05);color:var(--text-faint);}
  .badge.new{background:var(--amber-dim);color:var(--amber);}
  .badge.date-today{background:var(--date-green-dim);color:var(--date-green);}
  .badge.date-3d{background:var(--date-yellow-dim);color:var(--date-yellow);}
  .badge.date-7d{background:var(--date-blue-dim);color:var(--date-blue);}
  .badge.date-old{background:var(--red-dim);color:var(--red);}
  .title-link{color:inherit;text-decoration:none;border-bottom:1px dashed var(--text-faint);}
  .title-link:hover{border-bottom-color:var(--amber);color:var(--amber);}
  .card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  .link-btn{background:transparent;color:var(--text-dim);font-size:12px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;}
  .link-btn:hover{color:var(--text);border-color:#3a3f56;}
  .link-btn.on{color:var(--amber);border-color:var(--amber);}
  .notes-box{margin-top:10px;width:100%;background:var(--bg-alt);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:12px;font-family:var(--body);resize:vertical;min-height:44px;}
  .notes-box:focus{outline:none;border-color:var(--amber);}
  .note-banner{font-family:var(--mono);font-size:11px;color:var(--text-faint);text-align:center;padding:10px;border-bottom:1px solid var(--border);background:var(--bg-alt);}
  .expand-section{margin-top:10px;border-top:1px dashed var(--border);padding-top:10px;}
  .expand-toggle{font-family:var(--mono);font-size:11px;color:var(--violet);background:transparent;border:none;padding:0;cursor:pointer;}
  .expand-body{margin-top:8px;background:var(--bg-alt);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.6;color:var(--text);white-space:pre-wrap;display:none;}
  .expand-body.open{display:block;}
  .expand-body ul{margin:0;padding-left:16px;}
  @media(max-width:640px){.stats{display:none;} .topbar{padding:14px 14px 12px;} .content{padding:16px 12px 90px;}}
</style>
</head>
<body>

<div class="note-banner">Statusy i notatki zapisują się lokalnie w tej przeglądarce · nowe oferty dopisuje Twój Claude Code Routine w jobs.json</div>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <span class="radar-dot"></span>
      <div><h1>Job Radar</h1><div class="subtitle" id="lastUpdated">ładowanie…</div></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="statTotal">0</b>razem</div>
      <div class="stat"><b id="statApplied">0</b>aplikacje</div>
      <div class="stat"><b id="statVerified">0</b>zweryfikowane</div>
    </div>
    <button class="btn-ghost" onclick="location.reload()">↻ Odśwież</button>
  </div>
  <div class="search-row" style="display:flex;gap:8px;flex-wrap:wrap;">
    <input class="search-input" id="searchInput" placeholder="Szukaj po firmie, stanowisku, lokalizacji…" style="flex:1;min-width:160px;">
    <button class="btn-ghost" id="verifiedToggle">★ Tylko zweryfikowane</button>
    <button class="btn-ghost" id="archiveToggle">Pokaż starsze (&gt;7 dni)</button>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="content" id="content"></div>

<script>
const LS_KEY = 'job-radar-local-state-v1';
let data = {tagLabels:{}, jobs:[]};
let localState = {};
let activeTab = null;
let search = '';
let showArchived = false;
let onlyVerified = false;

function loadLocal(){
  try{ localState = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }catch(e){ localState = {}; }
}
function saveLocal(){ localStorage.setItem(LS_KEY, JSON.stringify(localState)); }
function getLocal(id){ return localState[id] || {stage:'new', notInterested:false, notes:''}; }
function setLocal(id, patch){ localState[id] = {...getLocal(id), ...patch}; saveLocal(); }

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
function fitLabel(f){ return f===3?'Strong fit':f===2?'Good fit':'Maybe fit'; }
function tagLabel(tag){ return (data.tagLabels && data.tagLabels[tag]) || tag.replace(/-/g,' ').replace(/\b\w/g, c=>c.toUpperCase()); }
function dateBadge(datePosted){
  if(!datePosted) return null;
  const ageMs = Date.now() - Date.parse(datePosted);
  if(isNaN(ageMs)) return null;
  const days = Math.floor(ageMs/86400000);
  if(days<=0) return {label:'● Dziś', cls:'date-today'};
  if(days<=3) return {label:`● ${days}d temu`, cls:'date-3d'};
  if(days<7) return {label:`● ${days}d temu`, cls:'date-7d'};
  return {label:`● ${days}d temu`, cls:'date-old'};
}

async function init(){
  loadLocal();
  try{
    const res = await fetch('./jobs.json?_=' + Date.now());
    data = await res.json();
    if(!data.tagLabels) data.tagLabels = {};
    // backward compat: old entries might still use "category" instead of "tags"
    data.jobs.forEach(j=>{ if(!j.tags) j.tags = j.category ? [j.category] : []; });
    document.getElementById('lastUpdated').textContent = data.jobs.length + ' ofert w bazie';
  }catch(e){
    document.getElementById('lastUpdated').textContent = 'nie udało się wczytać jobs.json';
  }
  const allTags = new Set();
  data.jobs.forEach(j=>j.tags.forEach(t=>allTags.add(t)));
  activeTab = allTags.size ? [...allTags][0] : null;
  render();
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  const counts = {};
  data.jobs.forEach(j=>j.tags.forEach(t=>counts[t]=(counts[t]||0)+1));
  const tags = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  if(!activeTab && tags.length) activeTab = tags[0];
  tags.forEach(tag=>{
    const btn = document.createElement('button');
    btn.className = 'tab' + (activeTab===tag?' active':'');
    btn.innerHTML = `${escapeHtml(tagLabel(tag))} <span style="opacity:.7">${counts[tag]}</span>`;
    btn.onclick = ()=>{ activeTab = tag; render(); };
    tabsEl.appendChild(btn);
  });
}

function renderStats(){
  document.getElementById('statTotal').textContent = data.jobs.length;
  document.getElementById('statApplied').textContent = data.jobs.filter(j=>getLocal(j.id).stage==='applied'||getLocal(j.id).stage==='interview').length;
  document.getElementById('statVerified').textContent = data.jobs.filter(j=>j.verified===true).length;
}

function renderContent(){
  const content = document.getElementById('content');
  content.innerHTML = '';
  let jobs = data.jobs.filter(j=>j.tags.includes(activeTab));
  const q = search.trim().toLowerCase();
  if(q) jobs = jobs.filter(j=>(j.title+' '+j.company+' '+(j.location||'')+' '+(j.description||'')).toLowerCase().includes(q));
  if(onlyVerified) jobs = jobs.filter(j=>j.verified===true);
  if(!showArchived){
    jobs = jobs.filter(j=>{
      const local = getLocal(j.id);
      if(local.stage==='applied' || local.stage==='interview') return true;
      if(!j.datePosted) return true;
      const ageMs = Date.now() - Date.parse(j.datePosted);
      return isNaN(ageMs) || ageMs <= 7*86400000;
    });
  }
  jobs.sort((a,b)=> (b.fit||1)-(a.fit||1) || (b.verified===true)-(a.verified===true));

  if(jobs.length===0){
    content.innerHTML = `<div class="empty"><b>Pusto tutaj</b>Twój Routine jeszcze nic tu nie dopisał, albo zmień zakładkę/wyszukiwanie.</div>`;
    return;
  }

  jobs.forEach(job=>{
    const local = getLocal(job.id);
    const card = document.createElement('div');
    card.className = `card fit-${job.fit||1}`;

    let badges = '';
    const db = dateBadge(job.datePosted);
    if(db) badges += `<span class="badge ${db.cls}">${db.label}</span>`;
    if(local.stage==='applied') badges += `<span class="badge applied">Aplikowano</span>`;
    if(local.stage==='interview') badges += `<span class="badge interview">Rozmowa</span>`;
    if(local.stage==='rejected') badges += `<span class="badge rejected">Odrzucone</span>`;
    if(local.notInterested) badges += `<span class="badge notint">Nie interesuje</span>`;
    if(local.stage==='new') badges += `<span class="badge new">Nowe</span>`;

    const otherTags = job.tags.filter(t=>t!==activeTab);
    const chips = otherTags.map(t=>`<span class="tag-chip">${escapeHtml(tagLabel(t))}</span>`).join('');

    const hasCover = job.coverLetterDraft && job.coverLetterDraft.trim();
    const hasCvTips = job.cvTips && job.cvTips.length;
    const prep = job.interviewPrep || {};
    const hasPrep = (prep.expected && prep.expected.length) || (prep.toAsk && prep.toAsk.length);

    const titleHtml = job.url
      ? `<a class="title-link" href="${escapeHtml(job.url)}" target="_blank" rel="noopener">${escapeHtml(job.title)}</a>`
      : escapeHtml(job.title);

    card.innerHTML = `
      <div class="card-title-row">
        <div class="signal" title="${fitLabel(job.fit)}"><i></i><i></i><i></i></div>
        <h3 class="card-title">${titleHtml} <span class="card-company">· ${escapeHtml(job.company)}</span></h3>
        <span class="verify-star ${job.verified===true?'yes':'no'}" title="${job.verified===true?'Zweryfikowane — link otwarty i potwierdzony bezpośrednio':'Niezweryfikowane — tylko wynik wyszukiwania, sprawdź ręcznie'}">${job.verified===true?'★ zweryfikowane':'☆ niezweryfikowane'}</span>
      </div>
      <div class="meta-line">${escapeHtml(job.location||'—')}</div>
      ${job.description?`<div class="desc">${escapeHtml(job.description)}</div>`:''}
      <div class="badges">${badges}</div>
      ${chips?`<div class="tag-chips">${chips}</div>`:''}
      <div class="card-actions">
        ${job.url?`<a class="link-btn" href="${escapeHtml(job.url)}" target="_blank" rel="noopener">Zobacz ofertę ↗</a>`:''}
        <button class="link-btn ${local.stage==='applied'?'on':''}" data-a="applied">Aplikowano</button>
        <button class="link-btn ${local.stage==='interview'?'on':''}" data-a="interview">Rozmowa</button>
        <button class="link-btn ${local.stage==='rejected'?'on':''}" data-a="rejected">Odrzucone</button>
        <button class="link-btn ${local.notInterested?'on':''}" data-a="notint">Nie interesuje</button>
        ${!hasCover?`<button class="link-btn" data-a="copyprompt">✎ Skopiuj prompt na list motywacyjny</button>`:''}
      </div>
      ${hasCover?`<div class="expand-section"><button class="expand-toggle" data-t="cover">▸ Pokaż list motywacyjny (draft)</button><div class="expand-body" data-b="cover">${escapeHtml(job.coverLetterDraft)}</div></div>`:''}
      ${hasCvTips?`<div class="expand-section"><button class="expand-toggle" data-t="cv">▸ Wskazówki do CV dla tej roli</button><div class="expand-body" data-b="cv"><ul>${job.cvTips.map(t=>`<li>${escapeHtml(t)}</li>`).join('')}</ul></div></div>`:''}
      ${hasPrep?`<div class="expand-section"><button class="expand-toggle" data-t="prep">▸ Przygotowanie do rozmowy</button><div class="expand-body" data-b="prep">${prep.expected&&prep.expected.length?`<b style="color:var(--text-dim)">Możesz się spodziewać:</b><ul>${prep.expected.map(t=>`<li>${escapeHtml(t)}</li>`).join('')}</ul>`:''}${prep.toAsk&&prep.toAsk.length?`<b style="color:var(--text-dim)">Warto zapytać:</b><ul>${prep.toAsk.map(t=>`<li>${escapeHtml(t)}</li>`).join('')}</ul>`:''}</div></div>`:''}
      <textarea class="notes-box" placeholder="Notatki…">${escapeHtml(local.notes||'')}</textarea>
    `;

    card.querySelector('[data-a="applied"]').onclick = ()=>{ setLocal(job.id,{stage: local.stage==='applied'?'new':'applied'}); render(); };
    card.querySelector('[data-a="interview"]').onclick = ()=>{ setLocal(job.id,{stage: local.stage==='interview'?'applied':'interview'}); render(); };
    card.querySelector('[data-a="rejected"]').onclick = ()=>{ setLocal(job.id,{stage: local.stage==='rejected'?'applied':'rejected'}); render(); };
    card.querySelector('[data-a="notint"]').onclick = ()=>{ setLocal(job.id,{notInterested: !local.notInterested}); render(); };
    const copyBtn = card.querySelector('[data-a="copyprompt"]');
    if(copyBtn) copyBtn.onclick = ()=>{
      const prompt = `Napisz krótki list motywacyjny na stanowisko "${job.title}" w firmie "${job.company}" (${job.location||''}). Opis oferty: ${job.description||'brak opisu'}. Oto moje doświadczenie: [WKLEJ SWOJE CV / KRÓTKI OPIS]`;
      navigator.clipboard.writeText(prompt).then(()=>alert('Skopiowano! Wklej do czatu z Claude.'));
    };
    card.querySelectorAll('.expand-toggle').forEach(btn=>{
      btn.onclick = ()=>{
        const key = btn.dataset.t;
        const body = card.querySelector(`[data-b="${key}"]`);
        body.classList.toggle('open');
        btn.textContent = (btn.textContent.startsWith('▸')?'▾':'▸') + btn.textContent.slice(1);
      };
    });
    const notesBox = card.querySelector('.notes-box');
    let t;
    notesBox.addEventListener('input', ()=>{ clearTimeout(t); t = setTimeout(()=>setLocal(job.id,{notes:notesBox.value}), 400); });

    content.appendChild(card);
  });
}

function render(){ renderTabs(); renderStats(); renderContent(); }

let searchTimer;
document.getElementById('searchInput').addEventListener('input', (e)=>{
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{ search = e.target.value; render(); }, 200);
});
document.getElementById('archiveToggle').addEventListener('click', ()=>{
  showArchived = !showArchived;
  document.getElementById('archiveToggle').classList.toggle('on', showArchived);
  document.getElementById('archiveToggle').textContent = showArchived ? 'Ukryj starsze' : 'Pokaż starsze (>7 dni)';
  render();
});
document.getElementById('verifiedToggle').addEventListener('click', ()=>{
  onlyVerified = !onlyVerified;
  document.getElementById('verifiedToggle').classList.toggle('on', onlyVerified);
  render();
});

init();
</script>
</body>
</html>
